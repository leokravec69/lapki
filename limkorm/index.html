<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" id="appTitle" content="Лапки тест">
<meta name="theme-color" content="#f4f7fa">
<link rel="manifest" id="manifestLink" href="manifest.json">
<link rel="apple-touch-icon" id="touchIcon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Лапки × Limkorm — тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#faf5f0;--card:#fff;--ink:#33231a;--muted:#958073;--line:#efe4da;
  --accent:#a8481f;--soft:color-mix(in srgb,var(--accent) 13%,white);
  --vac:#7c6cf0;--tick:#e38b2c;--worm:#3fae7a;--med:#d9577a;--vet:#3a8fd8;--groom:#c46bd1;--note:#958073;
  --red:#d9474f;--r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:0 0 calc(80px + env(safe-area-inset-bottom))}
body.onb{padding-bottom:20px}body.onb nav,body.onb header{display:none}
header{padding:10px 14px 0}
.pets{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none;align-items:center}
.pets::-webkit-scrollbar{display:none}
.pet{flex:none;display:flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:4px 12px 4px 4px;border:2px solid transparent;font-weight:700;font-size:15px;color:var(--ink);box-shadow:0 2px 8px rgba(120,80,50,.08)}
.pet.on{border-color:var(--accent)}
.pet .mini{width:32px;height:32px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--soft)}
.pet .mini img{width:100%;height:100%;object-fit:cover}
.addpet{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;font-size:22px;color:var(--accent);box-shadow:0 2px 8px rgba(120,80,50,.08)}
main{padding:4px 14px 20px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 2px 12px rgba(120,80,50,.07)}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,white),color-mix(in srgb,var(--accent) 45%,white) 65%,color-mix(in srgb,var(--accent) 70%,white));display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"🐾";position:absolute;right:-8px;bottom:-14px;font-size:90px;opacity:.12;transform:rotate(-20deg)}
.avatar{width:82px;height:82px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;flex:none;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero h2{margin:0;font-size:25px;letter-spacing:-.3px}
.hero .sub{color:color-mix(in srgb,var(--accent) 50%,black);font-size:14px;opacity:.85}
.stats{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.8);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
h3{margin:2px 2px 8px;font-size:18px}
/* widgets */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.w{background:#fff;border-radius:var(--r);padding:14px;box-shadow:0 2px 12px rgba(120,80,50,.07);position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column}
.w.wide{grid-column:span 2;min-height:auto}
.w .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.w .big{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin-top:4px}
.w .sm{font-size:13px;color:var(--muted)}
.ring{position:relative;width:96px;height:96px;margin:6px auto 4px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:26px;line-height:1}.ring .in span{font-size:10px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:6px;background:#f2ebe5;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;border-radius:6px}
.shield{display:flex;align-items:center;gap:10px;padding:7px 0}
.shield .e{font-size:22px;width:30px;text-align:center}
.paws{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.paws button{width:38px;height:38px;border-radius:12px;font-size:20px;background:#f4eee8;filter:grayscale(1);opacity:.45;transition:.2s}
.paws button.on{filter:none;opacity:1;background:var(--soft);transform:scale(1.05)}
.tip{background:linear-gradient(135deg,#fff7e8,#ffeccc)}
.wtap{transition:transform .15s}.wtap:active{transform:scale(.97)}
.spark{width:100%;height:46px;margin-top:auto}
.conf{position:absolute;inset:0;pointer-events:none;font-size:16px;opacity:.5}
/* lists */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--muted);font-size:13px}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.b-late{background:#fde0e2;color:var(--red)}.b-soon{background:#fff0dc;color:#b06a12}.b-ok{background:#e9f6ef;color:#2c8a5c}
button{font:inherit;border:0;cursor:pointer}
.btn{background:var(--accent);color:#fff;border-radius:15px;padding:13px 16px;font-weight:700;width:100%;font-size:16px}
.btn.sec{background:var(--soft);color:var(--accent)}
.btn.ghost{background:#f2ebe5;color:var(--ink)}
.btn.small{width:auto;padding:7px 12px;font-size:14px;border-radius:11px}
.empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;min-width:0;background:none;color:var(--muted);font-size:10.5px;font-weight:650;padding:4px 0}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--accent)}
nav .navfood.on{color:#2a7fb0}
nav .navfood span{filter:grayscale(.2)}
nav .plus{flex:none;width:48px;height:48px;border-radius:18px;background:var(--accent);color:#fff;font-size:28px;margin:-18px 6px 0;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:18px}
.calhead button{background:var(--soft);color:var(--accent);width:38px;height:38px;border-radius:12px;font-size:18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.day{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;position:relative;background:none;color:var(--ink)}
.day.out{opacity:.3}.day.today{border:2px solid var(--accent);font-weight:800}
.day.sel{background:var(--accent);color:#fff}
.day.bday::after{content:"🎂";position:absolute;top:-4px;right:-2px;font-size:11px}
.dots{display:flex;gap:2px;height:6px;margin-top:2px}.dots i{width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(40,20,10,.35);z-index:20;display:none;align-items:flex-end}
.mask.open{display:flex}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:3px;background:#dccabd;margin:2px auto 10px}
label{display:block;font-size:13px;color:var(--muted);font-weight:650;margin:12px 2px 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px;color:var(--ink)}
.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{background:var(--soft);color:var(--accent);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:650}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px transparent}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.actions{display:flex;gap:8px;margin-top:16px}
.filter{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;color:var(--ink);border:1px solid var(--line)}
.filter button.on{background:var(--ink);color:#fff}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
svg.chart{width:100%;height:150px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}.kv span{color:var(--muted)}
/* onboarding */
.onbw{min-height:100vh;padding:30px 20px;display:flex;flex-direction:column}
.onbw .logo{font-size:64px;text-align:center;margin-top:20px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.onbw h1{text-align:center;font-size:32px;margin:10px 0 4px;letter-spacing:-.5px}
.onbw p.lead{text-align:center;color:var(--muted);margin:0 0 18px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.feat div{background:#fff;border-radius:16px;padding:12px;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(120,80,50,.06)}
.feat div b{display:block;font-size:22px;margin-bottom:4px}
.species{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.species button{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;font-size:15px;font-weight:700;color:var(--ink)}
.species button span{display:block;font-size:36px}
.species button.on{border-color:var(--accent);background:var(--soft)}
.photopick{width:110px;height:110px;border-radius:50%;margin:6px auto;background:#fff;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);overflow:hidden;text-align:center}
.photopick img{width:100%;height:100%;object-fit:cover}
.lkcard{position:relative;margin:10px 0;border-radius:24px;padding:16px 16px 16px;color:#fff;cursor:pointer;overflow:hidden;
 background:radial-gradient(90% 80% at 100% 0%,#67c2ee88,transparent 60%),linear-gradient(150deg,#16486b,#0f2a3d 75%);box-shadow:0 8px 24px rgba(15,42,61,.25)}
.lkl{display:flex;align-items:center;gap:7px;font-weight:800;font-size:12px;letter-spacing:.6px;line-height:1.05}
.lkl img{width:26px;height:26px;filter:brightness(0) invert(1)}.lkl small{font-size:8.5px;letter-spacing:1.8px;opacity:.75}
.lkt{font-size:19px;font-weight:800;margin:12px 0 4px;max-width:70%;line-height:1.15}
.lks{font-size:13px;opacity:.8;max-width:68%}
.lkb{display:inline-block;margin-top:12px;background:#ffb547;color:#3d2400;font-weight:800;font-size:14px;border-radius:12px;padding:9px 13px}
.lkp{position:absolute;right:14px;bottom:14px;width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid #fff;background:#fff;display:flex;align-items:center;justify-content:center;font-size:42px}
.lkp img{width:100%;height:100%;object-fit:cover}
/* install */
.inst{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:20px;padding:12px 12px 12px 14px;margin:8px 0 10px;box-shadow:0 6px 18px rgba(60,30,10,.25);cursor:pointer;animation:pop .5s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.inst .ie{font-size:28px}.inst b{font-size:16px}.inst .s{color:rgba(255,255,255,.7);font-size:12.5px}
.inst .ib{background:var(--accent);color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.onbw .inst{margin:0 0 14px}
.isteps{counter-reset:s;margin:10px 0}
.isteps div{counter-increment:s;display:block;position:relative;padding:12px 0 12px 40px;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.7}
.isteps div:last-child{border:0}
.isteps div::before{content:counter(s);position:absolute;left:0;top:12px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.kbd{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-weight:700;white-space:nowrap}
.arrow{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:40px;z-index:25;animation:bounce 1s infinite;display:none}
.arrow.on{display:block;text-align:center;pointer-events:none}
.ahint{background:var(--ink);color:#fff;font-size:15px;line-height:1.35;padding:12px 16px;border-radius:16px;width:280px;margin:0 auto 6px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ahint small{opacity:.7;font-size:12px}
@keyframes bounce{50%{transform:translate(-50%,8px)}}

/* ===== ЕДИНЫЙ СТИЛЬ LIMKORM (как в подборе) ===== */
:root{--bg:#f4f7fa;--card:#fff;--ink:#132433;--muted:#6b7c8a;--line:#e3eaf0;--accent:#0f2a3d;--soft:#e8f3fa;--navy:#0f2a3d;--blue:#2a95cf;--sun:#ffb547;--r:26px;--hf:"Unbounded","Manrope",system-ui,sans-serif}
html,body{background:#dfe7ee;font-family:"Manrope",-apple-system,system-ui,sans-serif;color:var(--ink)}
body{max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;padding-top:0;padding-bottom:calc(104px + env(safe-area-inset-bottom));box-shadow:0 0 60px rgba(15,42,61,.15)}
.lktop{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;background:rgba(244,247,250,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lktop .brand{display:flex;align-items:center;gap:9px;font-family:var(--hf);font-weight:800;font-size:15px;letter-spacing:.5px;color:var(--navy)}
.lktop .brand img{width:30px;height:30px}.lktop .brand small{display:block;font-family:"Manrope",-apple-system,system-ui,sans-serif;font-weight:700;font-size:9.5px;letter-spacing:2px;color:var(--blue);margin-top:-2px}
.lktop .demo{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:99px;padding:6px 10px}
header{padding:4px 14px 0}
.pet{border-radius:99px;font-family:"Manrope",-apple-system,system-ui,sans-serif;font-weight:800;box-shadow:0 4px 14px rgba(15,42,61,.08)}
.pet.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--sun),0 6px 16px rgba(15,42,61,.16)}
.addpet{color:var(--navy)}
.card,.w{border-radius:var(--r);box-shadow:0 6px 22px rgba(15,42,61,.07)}
.hero{background:radial-gradient(110% 80% at 100% 0%,#67c2ee88,transparent 55%),linear-gradient(150deg,#16486b,#0f2a3d 75%)!important;color:#fff;border-radius:30px}
.hero::after{opacity:.08}
.hero h2{font-family:var(--hf);font-weight:800;font-size:26px;letter-spacing:-.6px;color:#fff}
.hero .sub{color:rgba(255,255,255,.8)!important}
.hero .pill{background:rgba(255,255,255,.16);color:#fff}
.avatar{border-color:#fff}
h3{font-family:var(--hf);font-weight:700;font-size:17px;letter-spacing:-.3px;color:var(--navy)}
.w .lbl{color:var(--blue);letter-spacing:1px}
.w .big{font-family:var(--hf);font-weight:800;color:var(--navy)}
.btn{background:var(--navy);border-radius:18px;font-family:"Manrope",-apple-system,system-ui,sans-serif;font-weight:800}
.btn.sec{background:var(--soft);color:var(--navy)}
.btn.ghost{background:#eef2f6;color:var(--navy)}
.badge.b-ok{background:#e6f6ef}
.cats button.on,.filter button.on,.species button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.species button{border-radius:22px}
.tip{background:linear-gradient(135deg,#fff7e3,#ffe9bf)}
input,select,textarea{font-family:"Manrope",-apple-system,system-ui,sans-serif;font-weight:600;border-radius:14px;border:2px solid var(--line);background:#fff;min-height:48px}
input[type=date]{color:var(--navy);font-weight:800}
label{color:var(--muted);font-weight:800;font-size:12.5px;letter-spacing:.3px}
.sheet{background:var(--bg);border-radius:28px 28px 0 0}
.onbw h1{font-family:var(--hf);font-weight:800;letter-spacing:-1px;color:var(--navy)}
.lkcard{border-radius:30px}
.inst{background:var(--navy)}.inst .ib{background:var(--sun);color:#3d2400}
/* единое плавающее меню */
nav{left:50%!important;right:auto!important;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom))!important;width:min(410px,calc(100% - 24px));border-radius:24px;background:rgba(15,42,61,.94)!important;border:0!important;padding:7px!important;box-shadow:0 12px 30px rgba(15,42,61,.35);align-items:center}
nav button,nav a{flex:1;color:rgba(255,255,255,.62)!important;font-family:"Manrope",-apple-system,system-ui,sans-serif;font-weight:800;font-size:10.5px!important;border-radius:18px;padding:7px 2px!important;text-decoration:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0}
nav button span,nav a span{font-size:20px!important;line-height:1}
nav .on{background:rgba(255,255,255,.14)!important;color:#fff!important}
nav .plus{flex:none!important;width:46px!important;height:46px!important;margin:0 2px!important;border-radius:16px!important;background:var(--sun)!important;color:#3d2400!important;font-size:26px!important;box-shadow:none!important;padding:0!important;justify-content:center}
nav img{filter:brightness(0) invert(1)}
/* луна */
.moon{margin:12px 0;border-radius:30px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(80% 60% at 80% 10%,#4b3fa8,transparent 60%),linear-gradient(170deg,#1b1640,#0b0a1f)}
.moon .orb{position:absolute;right:20px;top:20px;width:70px;height:70px;border-radius:50%;background:#f4efd6;box-shadow:0 0 40px #f4efd688;overflow:hidden}
.moon .orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:#1b1640;animation:phase 6s ease-in-out infinite}
@keyframes phase{0%{transform:translateX(-100%)}50%{transform:translateX(0)}100%{transform:translateX(100%)}}
.moon .soon{display:inline-block;background:var(--sun);color:#3d2400;font-weight:800;font-size:11px;letter-spacing:1px;text-transform:uppercase;border-radius:99px;padding:5px 10px}
.moon h3{color:#fff;font-size:20px;margin:10px 0 6px;max-width:220px}
.moon p{font-size:13.5px;opacity:.82;max-width:290px}

/* ============ ДАТЫ ============ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const fmt=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
function ageParts(birth){const b=parse(birth),t=new Date();let m=(t.getFullYear()-b.getFullYear())*12+t.getMonth()-b.getMonth();let d=t.getDate()-b.getDate();if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}return{y:Math.floor(m/12),m:m%12,d,total:m+d/30}}
function age(birth){if(!birth)return '';const a=ageParts(birth);const p=[];if(a.y)p.push(a.y+' '+plural(a.y,'год','года','лет'));if(a.m)p.push(a.m+' '+plural(a.m,'месяц','месяца','месяцев'));if(!a.y&&a.d)p.push(a.d+' '+plural(a.d,'день','дня','дней'));return p.join(' ')||'новорождённый'}
function humanYears(p){if(!p.birth)return null;const y=ageParts(p.birth).total/12;let h;if(y<1)h=y*15;else if(y<2)h=15+(y-1)*9;else h=24+(y-2)*(p.species==='cat'?4:5);return Math.max(0,Math.round(h))}
function repeatText(n){if(!n)return '';if(n===1)return 'каждый день';if(n%365===0)return 'раз в '+(n/365>1?n/365+' года':'год');if(n%30===0&&n<365)return 'раз в '+(n/30>1?n/30+' '+plural(n/30,'месяц','месяца','месяцев'):'месяц');if(n%7===0)return 'раз в '+(n/7>1?n/7+' '+plural(n/7,'неделю','недели','недель'):'неделю');return 'раз в '+n+' '+plural(n,'день','дня','дней')}
/* ============ ЛОГИКА ============ */
function upcoming(p=P()){
  const out=p.plans.map(x=>({...x,kind:'plan'}));const last={};
  p.records.forEach(r=>{if(!r.repeat)return;const k=r.cat+'|'+r.title.trim().toLowerCase();if(!last[k]||r.date>last[k].date)last[k]=r});
  Object.values(last).forEach(r=>{if(r.stopped)return;const next=addDays(r.date,r.repeat);if(r.until&&next>r.until)return;
    if(p.plans.some(x=>x.cat===r.cat&&x.title.trim().toLowerCase()===r.title.trim().toLowerCase()&&x.date>=r.date))return;
    out.push({id:'auto-'+r.id,cat:r.cat,title:r.title,date:next,note:r.note||'',repeat:r.repeat,until:r.until,kind:'auto',src:r.id,from:r.date})});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function lastOf(p,cat){return [...p.records].filter(r=>r.cat===cat).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function nextOf(p,cat){return upcoming(p).find(u=>u.cat===cat)}
function badge(dt){const n=diff(today(),dt);
  if(n<0)return `<span class="badge b-late">просрочено ${-n} дн.</span>`;if(n===0)return `<span class="badge b-soon">сегодня</span>`;
  if(n===1)return `<span class="badge b-soon">завтра</span>`;if(n<=7)return `<span class="badge b-soon">через ${n} дн.</span>`;return `<span class="badge b-ok">через ${n} дн.</span>`}
const icon=c=>`<div class="ic" style="background:color-mix(in srgb,${CATS[c].c} 16%,white)">${CATS[c].i}</div>`;

function ring(pct,col,inner){const r=42,c=2*Math.PI*r;pct=Math.max(0,Math.min(1,pct));
  return `<div class="ring"><svg width="96" height="96"><circle cx="48" cy="48" r="${r}" stroke="#f2ebe5" stroke-width="10" fill="none"/><circle cx="48" cy="48" r="${r}" stroke="${col}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" style="transition:stroke-dashoffset .8s"/></svg><div class="in">${inner}</div></div>`}
function wNext(p,up){
  const u=up[0];
  if(!u)return `<div class="w wtap" onclick="openAdd()"><div class="lbl">Следующее</div>${ring(0,'var(--accent)','<b>—</b><span>нет планов</span>')}<div class="sm" style="text-align:center">Нажмите, чтобы добавить</div></div>`;
  const n=diff(today(),u.date);const span=u.repeat||(u.from?diff(u.from,u.date):30)||30;const pct=n<=0?1:1-n/span;
  const col=n<0?'var(--red)':n<=3?'#e38b2c':'var(--accent)';
  return `<div class="w wtap" onclick="openUp('${u.id}')"><div class="lbl">${CATS[u.cat].i} Следующее</div>${ring(pct,col,n<0?`<b style="color:var(--red)">!</b><span>просрочено</span>`:n===0?`<b>🔔</b><span>сегодня</span>`:`<b>${n}</b><span>${plural(n,'день','дня','дней')}</span>`)}<div class="sm" style="text-align:center;font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.title)}</div></div>`;
}
function wHuman(p){
  const h=humanYears(p);
  if(h===null)return `<div class="w wtap" onclick="openPetForm('${p.id}')"><div class="lbl">По-человечески</div><div class="big">?</div><div class="sm">Укажите дату рождения</div></div>`;
  const stage=h<13?'малыш 🍼':h<20?'подросток 🛹':h<40?'в расцвете сил 💪':h<60?'солидный возраст 🎩':'мудрый старейшина 🧘';
  return `<div class="w"><div class="lbl">По-человечески</div><div class="big">${h} <span style="font-size:16px">${plural(h,'год','года','лет')}</span></div><div class="sm">${stage}</div>
    <div style="margin-top:auto;font-size:34px;text-align:right">${p.species==='cat'?(h<15?'🐱':'😺'):(h<15?'🐶':'🐕')}</div></div>`;
}
function wProtect(p){
  const items=[['tick','🛡️','Клещи'],['worm','🪱','Гельминты'],['vac','💉','Прививки']].map(([c,e,n])=>{
    const l=lastOf(p,c);const nx=nextOf(p,c);
    if(!l&&!nx)return `<div class="shield"><span class="e" style="opacity:.4">${e}</span><div class="grow"><div style="font-weight:650">${n}</div><div class="sm">нет данных</div></div></div>`;
    const end=nx?nx.date:null;const left=end?diff(today(),end):null;
    const span=l&&end?Math.max(1,diff(l.date,end)):30;const pct=left===null?0:Math.max(0,Math.min(1,left/span));

    return `<div class="shield"><span class="e">${e}</span><div class="grow"><div style="display:flex;justify-content:space-between"><b>${n}</b><span class="sm">${left===null?'сделано '+fmt(l.date):left<0?'просрочено':left===0?'сегодня':'ещё '+left+' дн.'}</span></div><div class="bar"><i style="width:${left===null?100:Math.max(4,pct*100)}%;background:${col}"></i></div></div></div>`;
  }).join('');
  return `<div class="w wide"><div class="lbl">Защита</div>${items}</div>`;
}
function wWalks(p){
  const t=today();const n=p.walks[t]||0;let streak=0,d=t;if(!n)d=addDays(t,-1);while((p.walks[d]||0)>0){streak++;d=addDays(d,-1)}
  const goal=p.species==='cat'?3:3;const lbl=p.species==='cat'?'Игры сегодня':'Прогулки сегодня';
  return `<div class="w"><div class="lbl">${lbl}</div><div class="paws">${Array.from({length:goal},(_,i)=>`<button class="${i<n?'on':''}" onclick="walk(${i+1})">${p.species==='cat'?'🧶':'🐾'}</button>`).join('')}</div>
    <div class="sm" style="margin-top:auto">${streak>1?`🔥 ${streak} ${plural(streak,'день','дня','дней')} подряд`:n>=goal?'Норма выполнена! 🎉':(p.species==='cat'?'Нажмите клубок после игры':'Нажмите лапку после прогулки')}</div></div>`;
}
function walk(k){const p=P(),t=today();const cur=p.walks[t]||0;p.walks[t]=(k===cur?k-1:k);
  const keep=Object.keys(p.walks).sort().slice(-120);p.walks=Object.fromEntries(keep.map(x=>[x,p.walks[x]]));save();render();if(p.walks[t]>cur)voice(1)}
function wWeight(p){
  const ws=[...p.weights].sort((a,b)=>a.date.localeCompare(b.date));const lw=ws[ws.length-1],pw=ws[ws.length-2];
  if(!lw)return `<div class="w wtap" onclick="openWeight()"><div class="lbl">Вес</div><div class="big">— кг</div><div class="sm">Нажмите, чтобы взвесить</div><div style="margin-top:auto;font-size:30px;text-align:right">⚖️</div></div>`;
  const d=pw?Math.round((lw.kg-pw.kg)*100)/100:0;
  let spark='';if(ws.length>1){const v=ws.slice(-8).map(w=>+w.kg),mn=Math.min(...v),mx=Math.max(...v);const pts=v.map((x,i)=>[i*(100/(v.length-1)),40-((x-mn)/((mx-mn)||1))*34]);
    spark=`<svg class="spark" viewBox="-3 -3 106 46" preserveAspectRatio="none"><polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${pts.map(q=>q.join(',')).join(' ')}"/></svg>`}
  return `<div class="w wtap" onclick="openWeight()"><div class="lbl">Вес</div><div class="big">${lw.kg} <span style="font-size:16px">кг</span></div><div class="sm">${pw?(d>0?'▲ +'+d:d<0?'▼ '+d:'без изменений')+' · ':''}${fmt(lw.date)}</div>${spark}</div>`;
}
function wBday(p){
  if(!p.birth)return '';const b=parse(p.birth),t=new Date();let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(iso(n)<today())n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());

  // для малышей — «месяцевщина»
  if(ageParts(p.birth).y<1&&days>31){const a=ageParts(p.birth);let nm=new Date(b.getFullYear(),b.getMonth()+a.y*12+a.m+1,b.getDate());const dm=diff(today(),iso(nm));const mm=a.y*12+a.m+1;
    return `<div class="w"><div class="lbl">Скоро</div><div class="big">${dm===0?'Сегодня!':dm}</div><div class="sm">${dm===0?'':plural(dm,'день','дня','дней')+' до '}${mm} ${plural(mm,'месяца','месяцев','месяцев')} 🎉</div><div style="margin-top:auto;font-size:30px;text-align:right">🧁</div></div>`}
  return `<div class="w" ${days===0?'onclick="voice(3)"':''}>${days===0?'<div class="conf">🎉 ✨ 🎊 ✨ 🎉<br>✨ 🎊 ✨ 🎉 ✨</div>':''}<div class="lbl">День рождения</div><div class="big">${days===0?'Сегодня!':days}</div><div class="sm">${days===0?'Исполнилось '+turns+' 🎂':plural(days,'день','дня','дней')+' до '+turns+'-летия'}</div><div style="margin-top:auto;font-size:30px;text-align:right">🎂</div></div>`;
}
function wTip(p){const list=TIPS[p.species]||TIPS.dog;const i=Math.floor(Date.now()/864e5)%list.length;
  return `<div class="w wide tip"><div class="lbl">💡 Совет дня</div><div style="margin-top:6px;font-weight:550">${list[i]}</div></div>`}
function upRow(u){return `<div class="row">${icon(u.cat)}<div class="grow" onclick="openUp('${u.id}')"><div class="t">${esc(u.title)}</div><div class="s">${fmt(u.date)}${u.repeat?' · '+repeatText(u.repeat):''}</div></div>
  <div style="text-align:right">${badge(u.date)}<br><button class="btn small sec" style="margin-top:5px" onclick="markDone('${u.id}')">✓ Сделано</button></div></div>`}
function recRow(r){return `<div class="row" onclick="openAdd(null,'${r.id}')">${icon(r.cat)}<div class="grow"><div class="t">${esc(r.title)}</div><div class="s">${fmt(r.date)}${r.repeat&&!r.stopped?' · '+repeatText(r.repeat):''}${r.note?' · '+esc(r.note):''}</div></div></div>`}

/* --- Календарь --- */
function calV(){
  const p=P();const y=calMonth.getFullYear(),m=calMonth.getMonth();const first=new Date(y,m,1);const start=new Date(y,m,1-((first.getDay()+6)%7));
  const ev=eventsMap(iso(start),iso(new Date(start.getFullYear(),start.getMonth(),start.getDate()+41)));const bd=p.birth?p.birth.slice(5):'';let cells='';

  const list=ev[selDay]||[];

  <div class="card"><h3>${fmt(selDay)}</h3>${list.length?list.map(e=>e.done?recRow(e):upRow(e)).join(''):'<div class="empty">Записей нет</div>'}
    <button class="btn sec" style="margin-top:10px" onclick="openAdd(null,null,'${selDay}')">＋ Добавить на этот день</button></div>`;
}
function shiftM(n){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);render()}
function eventsMap(from,to){const p=P();const map={};const add=(d,e)=>{if(d<from||d>to)return;(map[d]=map[d]||[]).push(e)};
  p.records.forEach(r=>add(r.date,{...r,done:true}));
  upcoming(p).forEach(u=>{add(u.date,u);if(u.repeat){let d=u.date,k=0;while(k++<400){d=addDays(d,u.repeat);if(d>to||(u.until&&d>u.until))break;add(d,{...u,date:d})}}});return map}

  <div class="card"><h3>История</h3>${recs.map(recRow).join('')||'<div class="empty">Пока пусто</div>'}</div>`;

function chart(ws){const W=320,H=140,pd=22;const xs=ws.map(w=>parse(w.date).getTime()),ys=ws.map(w=>+w.kg);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)*0.9,y1=Math.max(...ys)*1.05;
  const X=t=>pd+(W-2*pd)*((t-x0)/((x1-x0)||1)),Y=v=>H-pd-(H-2*pd)*((v-y0)/((y1-y0)||1));const pts=ws.map((w,i)=>[X(xs[i]),Y(ys[i])]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" points="${pts.map(q=>q.join(',')).join(' ')}"/>${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#fff" stroke="var(--accent)" stroke-width="2"/><text x="${q[0]}" y="${q[1]-9}" font-size="10" text-anchor="middle" fill="#958073">${ys[i]}</text>`).join('')}</svg>`}

function petSize(p){if(p.size)return p.size;const w=[...p.weights].sort((a,b)=>a.date.localeCompare(b.date)).pop();
  if(XS_BREEDS.test(p.breed||''))return 'xs';if(L_BREEDS.test(p.breed||''))return 'l';
  if(w&&p.birth&&ageParts(p.birth).total>=12){return w.kg<4?'xs':w.kg<10?'s':w.kg<25?'m':'l'}return 's'}
function petStage(p){if(!p.birth)return 'adult';const m=ageParts(p.birth).total;const grow=p.species==='dog'&&petSize(p)==='l'?15:12;return m<grow?'young':m>=84?'senior':'adult'}

function pickFeeds(p){
  const sp=p.species,size=petSize(p),needs=p.needs||[];let stage=petStage(p);let note='';
  if(stage==='senior'&&sp==='dog'){stage='adult';note='Отдельных кормов для пожилых собак в линейках Limkorm нет — показаны корма для взрослых. Обсудите рацион с ветеринаром.'}
  let list=FEEDS.filter(f=>f.sp===sp&&(f.age===stage||(stage==='senior'&&f.age==='adult'))&&(f.size.includes('all')||f.size.includes(size)));
  // специальные корма показываем, только если у питомца есть эта особенность
  list=list.filter(f=>!f.needs.length||f.needs.some(n=>needs.includes(n)));
  if(sp==='cat'&&needs.includes('sterile')&&stage!=='young'){const st=list.filter(f=>f.needs.includes('sterile')||f.needs.some(n=>n!=='sterile'&&needs.includes(n)));if(st.length)list=st}
  const score=f=>f.needs.filter(n=>needs.includes(n)).length*2+(f.size.includes(size)?1:0)-(f.wet?0.5:0);
  list.sort((a,b)=>score(b)-score(a));
  return {list,note,stage,size};
}

const foodLabel=f=>BRANDS[f.b].n+' · '+f.name+(f.protein?' ('+f.protein+')':'');
function goPicker(){location.href='podbor.html#pet='+P().id}
function setPet(k,v){P()[k]=v;save();render()}
function toggleNeed(n){const p=P();p.needs=p.needs||[];p.needs=p.needs.includes(n)?p.needs.filter(x=>x!==n):[...p.needs,n];save();render()}
function chooseFood(id){const f=FEEDS.find(x=>x.id===id);const p=P();p.food=foodLabel(f);save();goal('food_choose');render();toast('Корм сохранён в профиле 🍖')}

/* ============ ФОРМЫ ============ */
function sheet(html){document.getElementById('sheet').innerHTML='<div class="grab"></div>'+html;document.getElementById('mask').classList.add('open')}
function closeSheet(){document.getElementById('mask').classList.remove('open')}
let F={};
function openAdd(cat,id,date){const p=P();const r=id?p.records.find(x=>x.id===id):null;
  F=r?{...r,mode:'rec'}:{id:null,cat:cat||'vac',title:'',date:date||today(),note:'',repeat:0,until:'',mode:'new',status:(date&&date>today())?'plan':'done'};formSheet()}
function openUp(id){const u=upcoming().find(x=>x.id===id);if(!u)return;if(u.kind==='plan'){F={...u,mode:'plan'};formSheet()}else openAdd(null,u.src)}
const REPS=[[0,'Не повторять'],[1,'Каждый день'],[7,'Раз в неделю'],[14,'Раз в 2 недели'],[21,'Раз в 3 недели'],[30,'Раз в месяц'],[35,'Раз в 35 дней'],[42,'Раз в 6 недель'],[84,'Раз в 12 недель'],[90,'Раз в 3 месяца'],[150,'Раз в 5 месяцев'],[180,'Раз в полгода'],[365,'Раз в год']];
function formSheet(){const p=P();const reps=REPS.concat(F.repeat&&!REPS.some(r=>r[0]===+F.repeat)?[[+F.repeat,repeatText(+F.repeat)]]:[]);
  sheet(`<h3>${F.mode==='rec'?'Запись':F.mode==='plan'?'Запланировано':'Новая запись · '+esc(p.name)}</h3>

  ${F.mode==='new'?`<label>Статус</label><div class="cats"><button class="${F.status==='done'?'on':''}" onclick="setF('status','done')">✓ Уже сделано</button><button class="${F.status==='plan'?'on':''}" onclick="setF('status','plan')">🗓 Запланировать</button></div>`:''}
  <label>Название / препарат</label><input id="f-title" value="${esc(F.title)}" placeholder="Например: ${esc(tpl(p.species,F.cat)[0]?.[0]||'')}">
  <div class="chips">${tpl(p.species,F.cat).map((t,i)=>`<button onclick="useT(${i})">${esc(t[0])}${t[1]?' · '+repeatText(t[1]):''}</button>`).join('')}</div>
  <div class="two"><div><label>Дата</label><input type="date" id="f-date" value="${F.date}"></div><div><label>Повторять</label><select id="f-rep">${reps.map(o=>`<option value="${o[0]}" ${+F.repeat===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div>
  <label>Повторять до (для курса, необязательно)</label><input type="date" id="f-until" value="${F.until||''}">
  <label>Заметка (доза, клиника, реакция)</label><textarea id="f-note" placeholder="Например: 1/4 таблетки, после еды">${esc(F.note||'')}</textarea>
  ${F.mode==='rec'&&F.repeat?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-stop" ${F.stopped?'checked':''} style="width:auto;-webkit-appearance:checkbox;appearance:auto"> Больше не повторять</label>`:''}
  <div class="actions">${F.mode!=='new'?`<button class="btn ghost" onclick="delF()">Удалить</button>`:''}<button class="btn" onclick="saveF()">Сохранить</button></div>
  ${F.mode==='plan'?`<button class="btn sec" style="margin-top:8px" onclick="saveF(true)">✓ Сделано сегодня</button>`:''}`)}
function keepInputs(){const g=id=>document.getElementById(id);if(!g('f-title'))return;F.title=g('f-title').value;F.date=g('f-date').value;F.repeat=+g('f-rep').value;F.until=g('f-until').value;F.note=g('f-note').value}
function setF(k,v){keepInputs();F[k]=v;formSheet()}
function useT(i){keepInputs();const t=tpl(P().species,F.cat)[i];F.title=t[0];F.repeat=t[1];formSheet()}
function saveF(doneNow){const p=P();keepInputs();const stop=document.getElementById('f-stop');if(!F.title.trim())F.title=CATS[F.cat].n;if(!F.date){toast('Укажите дату');return}
  const base={cat:F.cat,title:F.title.trim(),date:F.date,note:F.note.trim(),repeat:+F.repeat||0,until:F.until||''};
  if(F.mode==='rec')Object.assign(p.records.find(r=>r.id===F.id),base,{stopped:stop?stop.checked:false});
  else if(F.mode==='plan'){p.plans=p.plans.filter(x=>x.id!==F.id);if(doneNow)p.records.push({...base,id:uid(),date:today()});else p.plans.push({...base,id:F.id})}
  else{if(F.status==='plan')p.plans.push({...base,id:uid()});else p.records.push({...base,id:uid()})}
  save();closeSheet();render();toast(F.status==='plan'&&F.mode==='new'?'Запланировано 🗓':'Сохранено ✓')}
function delF(){if(!confirm('Удалить запись?'))return;const p=P();p.records=p.records.filter(r=>r.id!==F.id);p.plans=p.plans.filter(x=>x.id!==F.id);save();closeSheet();render()}
function markDone(id){goal('done_click');const p=P();const u=upcoming().find(x=>x.id===id);if(!u)return;const day=today();
  if(u.kind==='plan')p.plans=p.plans.filter(x=>x.id!==u.id);p.records.push({id:uid(),cat:u.cat,title:u.title,date:day,note:u.note||'',repeat:u.repeat||0,until:u.until||''});

  img.onload=()=>{const c=document.createElement('canvas');const s=320;const k=Math.max(s/img.width,s/img.height);c.width=c.height=s;c.getContext('2d').drawImage(img,(s-img.width*k)/2,(s-img.height*k)/2,img.width*k,img.height*k);

    if(photoTarget==='ob'||(!S.pets.length&&OB.pet)){obKeep();OB.pet.photo=data;render()}else if(photoTarget==='pf'){pfKeep();PF.photo=data;petFormSheet()}else{const p=S.pets.find(x=>x.id===photoTarget);if(p){p.photo=data;save();render()}}};img.src=url;e.target.value=''};
async function shareFile(name,text,type){const file=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* Календарь: iPhone открывает .ics с адреса сайта и предлагает «Добавить все».
   Файл кладём в кэш, сервис-воркер отдаёт его по адресу calendar.ics */
let lastICS=null;
async function openICS(text){
  lastICS=text;
  if(ANDROID){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/calendar'}));a.download=(P()?.name||'pet')+'-napominaniya.ics';document.body.appendChild(a);a.click();a.remove();toast('Файл скачан — откройте его, чтобы добавить в Календарь');return}
  try{if(navigator.serviceWorker&&navigator.serviceWorker.controller){const c=await caches.open('ics');
    await c.put(new Request('calendar.ics'),new Response(text,{headers:{'Content-Type':'text/calendar; charset=utf-8'}}));
    location.href='calendar.ics?t='+Date.now();return}}catch(e){}
  location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(text);
}
function saveICS(){const t=buildICS();if(t)shareFile(`${P().name}-напоминания.ics`,t,'text/calendar')}
function exportICS(){const t=buildICS();if(t){goal('calendar_export');openICS(t)}}
function buildICS(){const p=P();const up=upcoming(p).filter(u=>u.date>=addDays(today(),-1));if(!up.length){toast('Нет запланированных дел');return null}
  const [hh,mm]=(S.remindTime||'10:00').split(':');const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const e=s=>String(s).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lapki//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+e(p.name+' — здоровье')];
  up.forEach(u=>{const d=u.date.replace(/-/g,'');L.push('BEGIN:VEVENT','UID:'+p.id+'-'+u.id+'-'+d+'@lapki','DTSTAMP:'+stamp,'DTSTART:'+d+'T'+hh+mm+'00','DURATION:PT15M','SUMMARY:'+e(CATS[u.cat].i+' '+p.name+': '+u.title),'DESCRIPTION:'+e((u.note||'')+(u.repeat?' ('+repeatText(u.repeat)+')':'')));
    if(u.repeat){let rr='RRULE:FREQ=DAILY;INTERVAL='+u.repeat;rr+=u.until?';UNTIL='+u.until.replace(/-/g,'')+'T235959':(u.repeat>1?';COUNT=6':';COUNT=30');L.push(rr)}
    if(u.repeat!==1)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Завтра','TRIGGER:-P1D','END:VALARM');L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Сегодня','TRIGGER:PT0M','END:VALARM','END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n')}

// iPhone берёт иконку в момент «На экран Домой» — подставляем фото выбранного питомца
let iconKey='';
function updateIcon(){
  const p=P();if(!p)return;const key=p.id+p.theme+(p.photo?p.photo.length:0)+p.species;if(key===iconKey)return;iconKey=key;
  const S2=180,c=document.createElement('canvas');c.width=c.height=S2;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,S2,S2);gr.addColorStop(0,p.theme);gr.addColorStop(1,'#2a1a10');g.fillStyle=p.theme;g.fillRect(0,0,S2,S2);
  const draw=()=>{try{const url=c.toDataURL('image/png');document.getElementById('touchIcon').href=url;
    // название под иконкой = кличка питомца
    document.getElementById('appTitle').content=p.name;document.title=p.name+' — Лапки';
    if(!IOS)return;
    const m={name:p.name+' — Лапки',short_name:p.name,start_url:location.pathname.replace(/[^/]*$/,''),display:'standalone',background_color:'#faf5f0',theme_color:p.theme,icons:[{src:url,sizes:'180x180',type:'image/png'}]};
    const ml=document.getElementById('manifestLink');if(ml.dataset.blob)URL.revokeObjectURL(ml.dataset.blob);const bu=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));ml.href=bu;ml.dataset.blob=bu}catch(e){}};
  if(p.photo){const im=new Image();im.onload=()=>{g.drawImage(im,0,0,S2,S2);
      g.fillStyle='rgba(255,255,255,.92)';g.beginPath();g.arc(S2-30,S2-30,22,0,7);g.fill();g.font='26px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText('🐾',S2-30,S2-28);draw()};im.src=p.photo}
  else{g.font='110px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(SPECIES[p.species].i,S2/2,S2/2+6);draw()}
}

/* ============ ГАВ / МЯУ ============ */
let AC;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function bark(times){const A=ac();for(let i=0;i<times;i++){const t=A.currentTime+i*0.28;const o=A.createOscillator(),f=A.createBiquadFilter(),g=A.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(820,t);o.frequency.exponentialRampToValueAtTime(380,t+0.13);f.type='bandpass';f.frequency.value=1100;f.Q.value=1.4;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.9,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
  const n=A.createBufferSource(),buf=A.createBuffer(1,A.sampleRate*0.17,A.sampleRate),d=buf.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*0.35;n.buffer=buf;
  o.connect(f);n.connect(f);f.connect(g);g.connect(A.destination);o.start(t);o.stop(t+0.18);n.start(t)}}
function meow(times){const A=ac();for(let i=0;i<times;i++){const t=A.currentTime+i*0.75;const o=A.createOscillator(),f=A.createBiquadFilter(),g=A.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(520,t);o.frequency.linearRampToValueAtTime(820,t+0.22);o.frequency.linearRampToValueAtTime(480,t+0.6);
  f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1800,t+0.25);f.frequency.linearRampToValueAtTime(700,t+0.6);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.7,t+0.06);g.gain.setValueAtTime(0.7,t+0.4);g.gain.exponentialRampToValueAtTime(0.0001,t+0.62);
  o.connect(f);f.connect(g);g.connect(A.destination);o.start(t);o.stop(t+0.65)}}
function voice(n){try{const p=P();if(p&&p.species==='cat')meow(Math.min(n,2));else bark(n);if(navigator.vibrate)navigator.vibrate([60,100,60])}catch(e){}}
